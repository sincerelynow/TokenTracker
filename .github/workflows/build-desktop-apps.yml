name: build desktop apps (personal)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Desktop platform to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux
      no_cache:
        description: "Disable dependency caches"
        required: false
        type: boolean
        default: false

concurrency:
  group: personal-desktop-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

# This workflow only uploads short-lived Actions artifacts. It never creates a
# tag or GitHub Release, so it does not need repository write access.
permissions:
  contents: read

jobs:
  macos:
    if: inputs.target == 'all' || inputs.target == 'macos'
    name: macOS DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify synchronized versions
        run: npm run validate:versions

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: ${{ vars.TOKENTRACKER_INSFORGE_BASE_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ vars.TOKENTRACKER_INSFORGE_ANON_KEY }}
        run: npm run dashboard:build

      - name: Cache bundled Node.js downloads
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: /tmp/node-cache
          key: node-darwin-universal-22.22.2

      - name: Bundle embedded server
        env:
          NODE_CACHE_DIR: /tmp/node-cache
        run: bash TokenTrackerBar/scripts/bundle-node.sh

      - name: Install macOS packaging tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        working-directory: TokenTrackerBar
        run: |
          xcodegen generate
          ruby scripts/patch-pbxproj-icon.rb

      - name: Build universal app
        working-directory: TokenTrackerBar
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme TokenTrackerBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -Xfrontend -solver-expression-time-threshold=120" \
            clean build

          app_bin="$(find build/DerivedData/Build/Products/Release -name TokenTracker -path '*/MacOS/*' -maxdepth 5)"
          lipo -info "$app_bin"
          lipo -info "$app_bin" 2>&1 | grep -q x86_64
          lipo -info "$app_bin" 2>&1 | grep -q arm64

      - name: Ad-hoc sign app
        working-directory: TokenTrackerBar
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products/Release -name TokenTracker.app -maxdepth 1)"
          appex_path="$app_path/Contents/PlugIns/TokenTrackerWidget.appex"

          find "$app_path/Contents/Resources/EmbeddedServer" -type f \
            \( -name node -o -name '*.dylib' -o -name '*.so' -o -name '*.node' \) \
            -exec codesign --force --timestamp=none --sign - {} \;

          if [ -d "$appex_path" ]; then
            codesign --force --timestamp=none \
              --entitlements TokenTrackerWidget/TokenTrackerWidget.entitlements \
              --sign - "$appex_path"
          fi

          codesign --force --timestamp=none \
            --entitlements TokenTrackerBar/TokenTrackerBar.entitlements \
            --sign - "$app_path"
          codesign --verify --verbose=2 "$app_path"

          if [ -d "$appex_path" ]; then
            codesign -d --entitlements - "$appex_path" 2>&1 | tee /tmp/personal-widget-entitlements.txt
            grep -q com.apple.security.app-sandbox /tmp/personal-widget-entitlements.txt
          fi

      - name: Create DMG
        working-directory: TokenTrackerBar
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products/Release -name TokenTracker.app -maxdepth 1)"
          bash scripts/create-dmg.sh "$app_path"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: TokenTracker-macOS-${{ github.run_number }}
          path: TokenTrackerBar/build/TokenTrackerBar.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify synchronized versions
        run: npm run validate:versions

      - name: Read app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: ${{ vars.TOKENTRACKER_INSFORGE_BASE_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ vars.TOKENTRACKER_INSFORGE_ANON_KEY }}
          TOKENTRACKER_BUILD_PET: "1"
        run: npm run dashboard:build

      - name: Cache bundled Node.js download
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ttnode-22.22.2
          key: node-win-x64-22.22.2

      - name: Bundle embedded server
        env:
          NODE_CACHE_DIR: ${{ runner.temp }}\ttnode-22.22.2
        run: powershell -ExecutionPolicy Bypass -File TokenTrackerWin/scripts/bundle-node.ps1

      - name: Cache NuGet packages
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('TokenTrackerWin/TokenTrackerWin.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish self-contained app
        run: dotnet publish TokenTrackerWin/TokenTrackerWin.csproj -c Release -r win-x64 --self-contained true -o TokenTrackerWin/publish

      - name: Stage and verify embedded server
        shell: pwsh
        run: |
          Copy-Item TokenTrackerWin/EmbeddedServer TokenTrackerWin/publish/EmbeddedServer -Recurse -Force
          $required = @(
            "TokenTrackerWin/publish/TokenTracker.exe",
            "TokenTrackerWin/publish/EmbeddedServer/node.exe",
            "TokenTrackerWin/publish/EmbeddedServer/tokentracker/bin/tracker.js",
            "TokenTrackerWin/publish/EmbeddedServer/tokentracker/dashboard/dist/index.html"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
          }

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path TokenTrackerWin/publish/* -DestinationPath "TokenTracker-win-x64-v$env:APP_VERSION.zip" -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" TokenTrackerWin\installer\TokenTracker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: TokenTracker-Windows-${{ github.run_number }}
          path: |
            TokenTracker-win-x64-v*.zip
            TokenTrackerWin/installer/Output/TokenTracker-Setup-v*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            TokenTrackerLinux/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify synchronized versions
        run: npm run validate:versions

      - name: Install Tauri build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            desktop-file-utils \
            fuse3 \
            rpm \
            cpio

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.no_cache }}
        with:
          workspaces: TokenTrackerLinux/src-tauri

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: ${{ vars.TOKENTRACKER_INSFORGE_BASE_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ vars.TOKENTRACKER_INSFORGE_ANON_KEY }}
        run: npm run dashboard:build

      - name: Install Linux client dependencies
        run: npm ci --prefix TokenTrackerLinux --no-audit --no-fund

      - name: Bundle embedded server
        run: npm --prefix TokenTrackerLinux run bundle:node

      - name: Build Linux packages
        run: npm --prefix TokenTrackerLinux run build

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="TokenTrackerLinux/src-tauri/target/release/bundle"
          appimages=("$bundle_root"/appimage/*.AppImage)
          debs=("$bundle_root"/deb/*.deb)
          rpms=("$bundle_root"/rpm/*.rpm)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one AppImage, deb, and rpm package" >&2
            find "$bundle_root" -maxdepth 3 -type f -print
            exit 1
          fi
          mkdir -p dist-personal-linux
          cp "${appimages[0]}" dist-personal-linux/TokenTracker-linux-x86_64.AppImage
          cp "${debs[0]}" dist-personal-linux/TokenTracker-linux-x86_64.deb
          cp "${rpms[0]}" dist-personal-linux/TokenTracker-linux-x86_64.rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: TokenTracker-Linux-${{ github.run_number }}
          path: dist-personal-linux/
          if-no-files-found: error
          retention-days: 7
